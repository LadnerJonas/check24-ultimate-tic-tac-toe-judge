[package]
name = "check24-ultimate-tic-tac-toe-judge"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
futures-util = "0.3.31"
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
tokio-tungstenite = "0.26.2"
tungstenite = "0.26.2"
rand = "0.9.1"
rocket = { version = "0.5.1", features = ["json"] }
dashmap = "6.1.0"
